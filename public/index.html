<!DOCTYPE html>
<html>
<head>
    <title>QA Panel</title>
    <link rel="stylesheet" href="styles/settings.css">
    <link rel="stylesheet" href="styles/ai-settings.css">
    <link rel="stylesheet" href="styles/shortcuts.css">
    <link rel="stylesheet" href="styles/memory-controls.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: rgba(32, 33, 36, 0.9);
            color: #ffffff;
        }

        .app-header {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 24px;
            color: #ffa500;
            margin: 0;
        }

        .last-used-app {
            font-size: 14px;
            color: #ffa500;
            margin: 5px 0;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #captureBtn {
            background: none;
            border: 1px solid #ffa500;
            color: #ffa500;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #captureBtn:hover {
            background-color: rgba(255, 165, 0, 0.1);
        }

        #captureBtn:active {
            background-color: rgba(255, 165, 0, 0.2);
        }

        #captureBtn .icon {
            font-size: 16px;
        }

        #questionForm {
            margin-bottom: 20px;
        }

        #questionInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #2d2e31;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }

        #answerInput {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #2d2e31;
            border: 1px solid #444;
            color: #fff;
            resize: vertical;
            border-radius: 4px;
        }

        #submitBtn {
            width: 100%;
            padding: 10px;
            background-color: #ffa500;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #submitBtn:hover {
            background-color: #ffb52e;
        }

        #questionList {
            list-style: none;
            padding: 0;
        }

        #questionList li {
            background-color: #2d2e31;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        .question-number {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: #ffa500;
            color: #000;
            text-align: center;
            line-height: 24px;
            border-radius: 12px;
            margin-right: 10px;
        }

        .question-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .edit-btn, .delete-btn, .ai-answer-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .edit-btn {
            background-color: #4CAF50;
            color: white;
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
        }

        .ai-answer-btn {
            background-color: #2196F3;
            color: white;
        }

        #settingsBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #ffa500;
        }

        .ai-generated-badge, .reference-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }

        .ai-generated-badge {
            background-color: #2196F3;
            color: white;
        }

        .reference-badge {
            background-color: #9C27B0;
            color: white;
        }

        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .capture-preview {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            background-color: #2d2e31;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
            display: none;
        }

        .capture-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .capture-preview .close-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="app-header">
        <div>
            <h1 class="app-title">QA-Panel</h1>
            <div id="lastUsedApp" class="last-used-app">Last Used App: Windows Explorer</div>
        </div>
        <div class="header-controls">
            <button id="captureBtn" title="Capture screen for vision analysis">
                <span class="icon">📷</span>
                Capture Screen
            </button>
            <button id="settingsBtn">⚙️</button>
        </div>
    </div>

    <div id="memoryControls"></div>

    <form id="questionForm">
        <input type="text" id="questionInput" placeholder="Enter your question...">
        <textarea id="answerInput" placeholder="Enter or generate an answer..."></textarea>
        <button type="submit" id="submitBtn">Add Question</button>
    </form>

    <h2 style="color: #ffa500; margin-top: 30px;">Questions and Answers:</h2>
    <ul id="questionList"></ul>

    <div class="capture-preview">
        <button class="close-btn">×</button>
        <img id="capturePreview" alt="Screen capture preview">
    </div>

    <!-- Load services first -->
    <script src="services/OllamaService.js"></script>

    <!-- Load base components -->
    <script src="components/settings/ShortcutInput.js"></script>
    <script src="components/settings/ShortcutsList.js"></script>
    <script src="components/settings/ShortcutsModal.js"></script>
    <script src="components/settings/AISettings.js"></script>
    <script src="components/MemoryControls.js"></script>
    <script src="components/SettingsModal.js"></script>

    <!-- Load main renderer last -->
    <script src="renderer.js"></script>
</body>
</html>
