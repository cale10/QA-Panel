<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA-Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: rgba(128, 128, 128, 0.5);
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 8px;
        }
        h1, h2 {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, textarea, select {
            padding: 5px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #questionList {
            list-style-type: none;
            padding: 0;
        }
        #questionList li {
            background-color: rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
            position: relative;
        }
        #questionList li:focus {
            outline: 2px solid #4CAF50;
            background-color: rgba(255, 255, 255, 0.2);
        }
        .question-number {
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #4CAF50;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .question-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }
        .edit-btn, .delete-btn {
            padding: 5px 10px;
            font-size: 14px;
        }
        .edit-btn {
            background-color: #2196F3;
        }
        .delete-btn {
            background-color: #f44336;
        }
        #settingsForm {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QA-Panel</h1>
        <div id="lastUsedApp">Last Used App: Loading...</div>
        <form id="questionForm">
            <input type="text" id="questionInput" placeholder="Enter your question" required>
            <textarea id="answerInput" placeholder="Enter the answer (optional)"></textarea>
            <button type="submit" id="submitBtn">Add Question</button>
        </form>
        <h2>Questions and Answers:</h2>
        <ul id="questionList"></ul>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
