<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA-Tiles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: rgba(128, 128, 128, 0.5);
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 8px;
        }
        h1, h2, h3 {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, textarea, select {
            padding: 5px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.1);
            color: gray;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        select option {
            background-color: white;
            color: black;
        }
        button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #questionList {
            list-style-type: none;
            padding: 0;
        }
        #questionList li {
            background-color: rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .question-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }
        .edit-btn, .delete-btn {
            padding: 5px 10px;
            font-size: 14px;
        }
        .edit-btn {
            background-color: #2196F3;
        }
        .delete-btn {
            background-color: #f44336;
        }
        #settingsForm {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        .shortcuts {
            margin-top: 20px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .shortcut-input {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .shortcut-input input {
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QA-Tiles</h1>
        <div id="lastUsedApp">Last Used App: Loading...</div>
        <form id="questionForm">
            <input type="text" id="questionInput" placeholder="Enter your question" required>
            <textarea id="answerInput" placeholder="Enter the answer (optional)"></textarea>
            <button type="submit" id="submitBtn">Add Question</button>
        </form>
        <h2>Questions and Answers:</h2>
        <ul id="questionList"></ul>
        <form id="settingsForm">
            <h2>Settings</h2>
            <label for="backgroundColor">Background Color:</label>
            <input type="color" id="backgroundColor" name="backgroundColor">
            <label for="opacity">Opacity:</label>
            <input type="range" id="opacity" name="opacity" min="0" max="1" step="0.1" value="0.5">
            <label for="font">Font:</label>
            <select id="font" name="font">
                <option value="Arial">Arial</option>
                <option value="Helvetica">Helvetica</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier">Courier</option>
                <option value="Verdana">Verdana</option>
            </select>
            <label for="fontSize">Font Size:</label>
            <input type="number" id="fontSize" name="fontSize" min="8" max="32" value="16">
            <label for="fontColor">Font Color:</label>
            <input type="color" id="fontColor" name="fontColor" value="#ffffff">
            <h3>Keyboard Shortcuts</h3>
            <div class="shortcut-input">
                <label for="toggleApp">Show/Hide App:</label>
                <input type="text" id="toggleApp" name="toggleApp" placeholder="e.g., CommandOrControl+Shift+Space">
            </div>
            <div class="shortcut-input">
                <label for="newQuestion">New Question:</label>
                <input type="text" id="newQuestion" name="newQuestion" placeholder="e.g., CommandOrControl+Shift+N">
            </div>
            <div class="shortcut-input">
                <label for="exportData">Export Data:</label>
                <input type="text" id="exportData" name="exportData" placeholder="e.g., CommandOrControl+Shift+E">
            </div>
            <div class="shortcut-input">
                <label for="importData">Import Data:</label>
                <input type="text" id="importData" name="importData" placeholder="e.g., CommandOrControl+Shift+I">
            </div>
            <div class="shortcut-input">
                <label for="deleteQuestion">Delete Question:</label>
                <input type="text" id="deleteQuestion" name="deleteQuestion" placeholder="e.g., CommandOrControl+Shift+D">
            </div>
            <button type="submit">Save Settings</button>
        </form>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
